# Usado só no deploy da EC2:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adiciona a porta 80 pro Streamlit (link final sem ":8501"). Dependendo da
# implementação de compose, a 8501 do arquivo base pode continuar publicada
# também (merge de listas) — sem problema: o Security Group da EC2 só libera
# 80/443/22 (não a 8501).
#
# Backend publicado na 8000 de propósito, só pra deixar o Swagger (/docs)
# público pra demo/avaliação — /predict e /defaults continuam exigindo
# X-API-Key mesmo assim (a autenticação é da aplicação, não da rede), então
# ninguém consegue chamar de verdade sem a chave, só ver a documentação.
services:
  frontend:
    ports:
      - "80:8501"

  backend:
    ports:
      - "8000:8000"
